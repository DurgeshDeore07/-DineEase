<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DineEase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🍽️ DineEase</h1>
        <p>Order your food easily</p>
    </header>

    <main>
        <div id="table-section">
            <label for="table-number">Table Number:</label>

            <input type="number" id="table-number" placeholder="Enter table number" min="1">
        </div>
        <h2>Our Menu</h2>

        <div id="menu-container">
            <p>Loading menu...</p>
        </div>

        <div id="cart">
            <h2>🛒 Your Cart</h2>

            <div id="cart-items">
                <p>Your cart is empty.</p>
            </div>

            <h3>Total: ₹<span id="cart-total">0</span></h3>

            <button id="order-button" onclick="placeOrder()">
                Place Order
            </button>
        </div>
        <div id="customer-bill"></div>

    </main>

    <script src="script.js?v=2"></script>
</body>

</html>
